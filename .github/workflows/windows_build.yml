name: Windows 11 x64 Native Build & Packaging

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Native Windows x64 Release Executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build React Frontend Production Bundle
        shell: pwsh
        run: |
          Write-Host "=== Building Frontend Production Assets ==="
          cd src/frontend
          npm ci
          npm run build
          cd ../..

          # Refresh root dist directory with fresh build
          if (Test-Path -Path "dist") {
              Remove-Item -Path "dist" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "dist" | Out-Null
          Copy-Item -Path "src/frontend/dist/*" -Destination "dist" -Recurse -Force

          # Verify index.html exists
          if (-not (Test-Path -Path "dist/index.html")) {
              Write-Error "CRITICAL: dist/index.html was not generated!"
              exit 1
          }
          Write-Host "Frontend production bundle verified in dist/"

      - name: Configure CMake (Visual Studio 2022 x64)
        shell: pwsh
        run: |
          Write-Host "=== Configuring CMake for MSVC 2022 x64 ==="
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) {
              Write-Error "CMake configuration failed"
              exit $LASTEXITCODE
          }

      - name: Build C++17 Core, Tests & Native Launcher
        shell: pwsh
        run: |
          Write-Host "=== Building C++17 Release Targets ==="
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
              Write-Error "MSVC compilation failed"
              exit $LASTEXITCODE
          }

      - name: Execute C++17 Verification Test Suite (55 Tests)
        shell: pwsh
        run: |
          Write-Host "=== Running Complete Verification Test Suite ==="
          $testExe = Get-ChildItem -Path "build" -Filter "workbench_tests.exe" -Recurse | Select-Object -First 1
          if (-not $testExe) {
              Write-Error "workbench_tests.exe was not found in the build tree."
              exit 1
          }
          Write-Host "Executing test binary: $($testExe.FullName)"
          & $testExe.FullName
          if ($LASTEXITCODE -ne 0) {
              Write-Error "C++ Test Suite failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Verify Windows Runtime Execution & HTTP Health Check
        shell: pwsh
        run: |
          Write-Host "=== Validating Native Windows Execution ==="
          $serverExe = Get-ChildItem -Path "build" -Filter "workbench_server.exe" -Recurse | Select-Object -First 1
          if (-not $serverExe) {
              Write-Error "workbench_server.exe not found!"
              exit 1
          }

          # 1. Verify CLI modes (validates dynamic linking & absence of missing runtime DLL errors)
          Write-Host "Testing workbench_server.exe --help..."
          & $serverExe.FullName --help
          if ($LASTEXITCODE -ne 0) { Write-Error "CLI --help failed"; exit 1 }

          Write-Host "Testing workbench_server.exe --fea --elements 10..."
          & $serverExe.FullName --fea --elements 10
          if ($LASTEXITCODE -ne 0) { Write-Error "CLI --fea failed"; exit 1 }

          Write-Host "Testing workbench_server.exe --backprop..."
          & $serverExe.FullName --backprop
          if ($LASTEXITCODE -ne 0) { Write-Error "CLI --backprop failed"; exit 1 }

          # 2. Test daemon socket binding and HTTP responses
          Write-Host "Starting workbench_server daemon on port 8080..."
          $serverProc = Start-Process -FilePath $serverExe.FullName -ArgumentList "--port 8080 --no-browser" -PassThru
          Start-Sleep -Milliseconds 800

          try {
              $statusResp = Invoke-RestMethod -Uri "http://127.0.0.1:8080/api/status" -TimeoutSec 5
              Write-Host "HTTP /api/status response: $($statusResp | ConvertTo-Json -Compress)"
              if ($statusResp.status -ne "ok") {
                  Write-Error "Server returned non-ok status: $($statusResp.status)"
                  exit 1
              }

              $indexResp = Invoke-WebRequest -Uri "http://127.0.0.1:8080/index.html" -TimeoutSec 5
              Write-Host "HTTP /index.html status: $($indexResp.StatusCode)"
              if ($indexResp.StatusCode -ne 200) {
                  Write-Error "Static UI failed to serve (status $($indexResp.StatusCode))"
                  exit 1
              }
          } finally {
              Write-Host "Stopping daemon..."
              Stop-Process -Id $serverProc.Id -Force
          }

      - name: Prepare Standalone Release Package
        shell: pwsh
        run: |
          Write-Host "=== Staging Standalone Windows Release Package ==="
          $stageDir = "staging"
          if (Test-Path -Path $stageDir) { Remove-Item -Path $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Path "$stageDir\bin" | Out-Null

          # Locate compiled executables
          $serverExe = Get-ChildItem -Path "build" -Filter "workbench_server.exe" -Recurse | Select-Object -First 1
          $launchExe = Get-ChildItem -Path "build" -Filter "Launch.exe" -Recurse | Select-Object -First 1

          if (-not $serverExe) { Write-Error "workbench_server.exe missing from build output!"; exit 1 }
          if (-not $launchExe) { Write-Error "Launch.exe missing from build output!"; exit 1 }

          Write-Host "Copying Launch.exe to root..."
          Copy-Item -Path $launchExe.FullName -Destination "$stageDir\Launch.exe" -Force
          Copy-Item -Path "Launch.bat" -Destination "$stageDir\Launch.bat" -Force

          Write-Host "Copying workbench_server.exe to bin\..."
          Copy-Item -Path $serverExe.FullName -Destination "$stageDir\bin\workbench_server.exe" -Force

          Write-Host "Copying frontend distribution, data, docs, results, and sources..."
          Copy-Item -Path "dist" -Destination "$stageDir\dist" -Recurse -Force
          Copy-Item -Path "data" -Destination "$stageDir\data" -Recurse -Force
          Copy-Item -Path "results" -Destination "$stageDir\results" -Recurse -Force
          Copy-Item -Path "docs" -Destination "$stageDir\docs" -Recurse -Force
          Copy-Item -Path "src" -Destination "$stageDir\src" -Recurse -Force
          Copy-Item -Path "tests" -Destination "$stageDir\tests" -Recurse -Force
          Copy-Item -Path "CMakeLists.txt" -Destination "$stageDir\CMakeLists.txt" -Force
          Copy-Item -Path "README.md" -Destination "$stageDir\README.md" -Force

          # Verify package layout
          if (-not (Test-Path -Path "$stageDir\Launch.exe")) { Write-Error "Staging verification failed: Launch.exe missing"; exit 1 }
          if (-not (Test-Path -Path "$stageDir\bin\workbench_server.exe")) { Write-Error "Staging verification failed: bin\workbench_server.exe missing"; exit 1 }
          if (-not (Test-Path -Path "$stageDir\dist\index.html")) { Write-Error "Staging verification failed: dist\index.html missing"; exit 1 }

          # Compress staging directory
          $zipPath = "CandidateID_Workbench_Windows_x64.zip"
          if (Test-Path -Path $zipPath) { Remove-Item -Path $zipPath -Force }
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipPath -Force
          Write-Host "Successfully packaged: $zipPath ($([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB)"

      - name: Upload Windows x64 Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CandidateID_Workbench_Windows_x64
          path: CandidateID_Workbench_Windows_x64.zip
          retention-days: 30
